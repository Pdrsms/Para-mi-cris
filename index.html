<!DOCTYPE html>
<!-- saved from url=(0043)https://tsujin-n.github.io/Dylme.github.oi/ -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me?</title>
    <link rel="stylesheet" href="./index_files/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
    <link href="./index_files/css2" rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <div id="question-screen" class="card">
        <h1 class="title">Do you love me?</h1>
        <div class="gif-container">
          <img src="./index_files/giphy.gif" alt="Cute bear" class="cute-gif" id="initial-gif">
        </div>
        <div class="buttons">
          <button id="yes-btn" class="btn btn-yes" style="font-size: 23.04px; padding: 18px 24px;">Yes</button>
          <button id="no-btn" class="btn btn-no" style="font-size: 17.28px;">Are you sure?</button>
        </div>
      </div>

      <div id="success-screen" class="hidden">
        <h1 class="success-message">I knew it! ❤️</h1>
        <div class="gif-container">
          <img src="./index_files/giphy(1).gif" alt="Happy bear" class="cute-gif">
        </div>
        <p class="sub-text">You made the right choice!</p>
      </div>
    </div>

    <!-- Floating hearts container -->
    <div id="hearts-container"></div>

    <script src="./index_files/script.js.descarga"></script>
  
</body></html>
