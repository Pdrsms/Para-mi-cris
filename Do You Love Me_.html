<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me?</title>
    <link rel="stylesheet" href="./Do You Love Me__files/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
    <link href="./Do You Love Me__files/css2" rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <div id="question-screen" class="card">
        <h1 class="title">Do you love me?</h1>
        <div class="gif-container">
          <img src="foto.jpeg" alt="Nosotros">
        </div>
        <div class="buttons">
          <button id="yes-btn" class="btn btn-yes">Yes</button>
          <button id="no-btn" class="btn btn-no">No</button>
        </div>
      </div>

      <div id="success-screen" class="hidden">
        <h1 class="success-message">I knew it! ❤️</h1>
        <div class="gif-container">
          <img src="foto1.jpeg" alt="Us">
        </div>
        <p class="sub-text">You made the right choice!</p>
      </div>
    </div>

    <!-- Floating hearts container -->
    <div id="hearts-container"></div>

    <script src="./Do You Love Me__files/script.js.descarga"></script>
  
</body></html>
